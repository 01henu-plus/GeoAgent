[project]
name = "geoagent"
version = "0.1.0"
description = "A GIS-oriented intelligent assistant agent with reliable spatial execution."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
